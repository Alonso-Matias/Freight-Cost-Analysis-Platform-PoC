# Column Structure Configuration
# ==============================
# Defines the target column layout for posting files.
# The raw BMS download has 95 columns; this defines the 93-column target
# (adds Type of cost, Carrier Name, Posting Month; removes Only for CCTR, Accrual FO Exist).
#
# If another department's BMS export has different columns, they edit this file.

# Columns to ADD (not in raw download, computed by the pipeline)
computed_columns:
  - name: "Type of cost"
    source: "charge_type_mapping"       # from charge_type_mapping.yaml
    match_column: "Charge Type"         # column to match on
  - name: "Carrier Name"
    source: "carrier_mapping"            # from carrier_mapping.yaml
    match_column: "Carrier"             # column to match on
  - name: "Posting Month"
    source: "derived"
    derived_from: "Posting Date"        # derived from this column
    format: "YYYY-MM"                   # period format

# Columns to DROP from raw download (not needed in target)
drop_columns:
  - "Accrual FO Exist"

# Target column order (left to right in the output file)
target_columns:
